name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GHDL
        run: sudo apt-get update && sudo apt-get install -y ghdl
      - name: Install VUnit
        run: pip3 install --user vunit-hdl
      - name: Run VUnit tests
        run: python3 sim/run.py
